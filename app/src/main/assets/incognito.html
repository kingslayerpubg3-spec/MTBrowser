<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;background:#0B0714;color:#fff;font-family:sans-serif;text-align:center;padding:70px 24px}
  .ic{font-size:70px}
  h2{margin:18px 0 8px}
  p{color:#9A92B0;font-size:14px;line-height:1.5}
  form{display:flex;background:#2A1646;border-radius:26px;padding:4px 16px;margin-top:40px}
  input{flex:1;background:none;border:0;outline:0;color:#fff;font-size:16px;padding:12px 0}
  button{background:none;border:0;color:#B388FF;font-size:18px}
</style></head><body>
<div class="ic">🕶️</div>
<h2>You're in Incognito Mode</h2>
<p>Aapki browsing history, cookies aur<br>site data save nahi hoga.</p>
<form action="https://www.google.com/search" method="get">
  <input name="q" placeholder="Search or type URL" autocomplete="off">
  <button type="submit">🔍</button>
</form>
</body></html>
