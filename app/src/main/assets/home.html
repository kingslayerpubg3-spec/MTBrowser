<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg1:#0B1E4A;--bg2:#050B1E;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.10);--tx:#fff;--sub:#8FA0C0;--ac:#2E8BFF}
body.light{--bg1:#DCE8FF;--bg2:#F4F6FA;--card:#fff;--bd:#E0E6F2;--tx:#14213D;--sub:#5A6785}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--tx);font-family:sans-serif;padding:28px 18px 40px;background:linear-gradient(180deg,var(--bg1),var(--bg2) 55%) fixed}
.logo{width:68px;height:68px;border-radius:20px;margin:6px auto 14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#12306F,#050B1E);box-shadow:0 0 28px rgba(46,139,255,.55);font-weight:900;font-size:26px}
.logo b{color:#4FA3FF}.logo i{color:#fff;font-style:normal}
h1{margin:0;text-align:center;font-size:28px}
h1 span{background:linear-gradient(90deg,#4FC3FF,#2E6BFF);-webkit-background-clip:text;color:transparent}
.tag{text-align:center;color:var(--sub);font-size:12px;margin:6px 0 22px;letter-spacing:2px}
form{display:flex;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:28px;padding:4px 8px 4px 18px;margin-bottom:26px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font-size:16px;padding:13px 0}
input::placeholder{color:var(--sub)}
button{width:40px;height:40px;border:0;border-radius:50%;background:var(--ac);color:#fff;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 6px}
.grid a{text-decoration:none;color:var(--tx);text-align:center;font-size:12px}
.ic{width:58px;height:58px;border-radius:18px;margin:0 auto 7px;background:#F1F4FA;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.25);overflow:hidden}
.ic img{width:34px;height:34px}
.ic span{display:none;font-weight:800;font-size:22px;color:#14213D}
.ic.fb span{display:block}
h3{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--sub);margin:30px 4px 12px}
.q{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;font-size:14px}
.q em{font-style:normal;font-size:20px}
</style><style id="mtsmooth">html{scroll-behavior:smooth}body{overscroll-behavior:none}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}form{animation:up .45s both}.grid a,.q a{transition:transform .12s;animation:up .5s both}.grid a:active,.q a:active{transform:scale(.93)}.q a{animation-delay:.35s}.grid a:nth-child(1){animation-delay:.11s}.grid a:nth-child(2){animation-delay:.14s}.grid a:nth-child(3){animation-delay:.17s}.grid a:nth-child(4){animation-delay:.20s}.grid a:nth-child(5){animation-delay:.23s}.grid a:nth-child(6){animation-delay:.26s}.grid a:nth-child(7){animation-delay:.29s}.grid a:nth-child(8){animation-delay:.32s}.grid a:nth-child(9){animation-delay:.35s}.grid a:nth-child(10){animation-delay:.38s}.grid a:nth-child(11){animation-delay:.41s}.grid a:nth-child(12){animation-delay:.44s}</style></head><body>
<svg viewBox="0 0 1254 1254" width="96" height="96" style="display:block;margin:0 auto 12px"><defs><linearGradient id="a" gradientUnits="userSpaceOnUse" x1="936" y1="357" x2="420" y2="790"><stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#0A5CFF"/></linearGradient><linearGradient id="b" gradientUnits="userSpaceOnUse" x1="216" y1="800" x2="717" y2="760"><stop offset="0" stop-color="#2AE0FF"/><stop offset="1" stop-color="#1A7BFF"/></linearGradient></defs><path d="M340,158 L907,158 A190,190 0 0 1 1097,348 L1097,900 A190,190 0 0 1 907,1090 L340,1090 A190,190 0 0 1 150,900 L150,348 A190,190 0 0 1 340,158 Z" fill="#061226" stroke="#1E8CFF" stroke-width="22"/><path d="M355,403 L592,530 L936,357 L936,462 L727,562 L727,590 L583,675 L466,592 L466,782 L356,793 Z" fill="url(#a)"/><path d="M727,568 L1018,455 L1018,527 L857,606 L857,866 L752,920 L752,672 L612,740 L612,692 L727,628 Z" fill="#F4F8FF"/><path d="M335,657 C285,715 262,775 300,800 C380,825 560,790 717,727 L717,735 C560,830 330,890 240,840 C180,800 230,710 335,657 Z" fill="url(#b)"/></svg>
<h1><span>MT</span> Browser</h1>
<p class="tag">FAST • SAFE • SMART</p>
<form action="https://www.google.com/search" method="get">
<input name="q" placeholder="Search or type URL" autocomplete="off"><button type="submit">&#128269;</button>
</form>
<div class="grid" id="g"></div>
<h3>Quick Access</h3>
<div class="q">
<a href="mt://bookmarks"><em>⭐</em>Bookmarks</a>
<a href="mt://downloads"><em>⬇️</em>Downloads</a>
<a href="mt://history"><em>🕘</em>History</a>
<a href="mt://settings"><em>⚙️</em>Settings</a>
</div>
<script src="icons.js"></script>
</body></html>
