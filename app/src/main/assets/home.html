<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;background:#050B1E;color:#fff;font-family:sans-serif;padding:20px 16px}
  h1{font-size:26px;margin:20px 0 4px;text-align:center}
  h1 span{color:#2E8BFF}
  p.tag{text-align:center;color:#8A94A8;font-size:13px;margin:0 0 22px;font-style:italic}
  form{display:flex;background:#14213D;border-radius:26px;padding:4px 16px;margin-bottom:26px}
  input{flex:1;background:none;border:0;outline:0;color:#fff;font-size:16px;padding:12px 0}
  button{background:none;border:0;color:#2E8BFF;font-size:18px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px}
  a{text-decoration:none;color:#cfd6e4;text-align:center;font-size:12px}
  .ic{width:54px;height:54px;border-radius:15px;margin:0 auto 6px;display:flex;
      align-items:center;justify-content:center;font-size:24px;font-weight:bold;color:#fff}
  h3{font-size:14px;color:#8A94A8;margin:30px 0 10px}
  .q a{display:block;text-align:left;background:#0F1A33;padding:13px 14px;
       border-radius:12px;margin-bottom:8px;font-size:14px}
  body.light{background:#F4F6FA;color:#14213D} body.light form{background:#E3E8F2} body.light input{color:#14213D} body.light a{color:#33415c} body.light .q a{background:#E3E8F2} body.light h3{color:#5a6785}
</style></head><body>
<h1><span>MT</span> Browser</h1>
<p class="tag">Fast • Safe • Smart</p>
<form action="https://www.google.com/search" method="get">
  <input name="q" placeholder="Search or type URL" autocomplete="off">
  <button type="submit">🔍</button>
</form>
<div class="grid">
  <a href="https://m.youtube.com"><div class="ic" style="background:#FF0000">▶</div>YouTube</a>
  <a href="https://m.facebook.com"><div class="ic" style="background:#1877F2">f</div>Facebook</a>
  <a href="https://www.instagram.com"><div class="ic" style="background:linear-gradient(45deg,#f9a825,#e91e63,#7b1fa2)">◎</div>Instagram</a>
  <a href="https://x.com"><div class="ic" style="background:#000;border:1px solid #333">X</div>X</a>
  <a href="https://en.wikipedia.org"><div class="ic" style="background:#fff;color:#000">W</div>Wikipedia</a>
  <a href="https://www.amazon.in"><div class="ic" style="background:#FF9900">a</div>Amazon</a>
  <a href="https://www.flipkart.com"><div class="ic" style="background:#2874F0">F</div>Flipkart</a>
  <a href="https://www.google.com"><div class="ic" style="background:#34A853">G</div>Google</a>
</div>
<h3>Quick Access</h3>
<div class="q">
  <a href="mt://bookmarks">⭐  Bookmarks</a>
  <a href="mt://downloads">⬇  Downloads</a>
  <a href="mt://history">🕘  History</a>
  <a href="mt://settings">⚙  Settings</a>
</div>
</body></html>
